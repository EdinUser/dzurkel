<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-labelledby="title">
  <title id="title">Dzurkel symbolic</title>
  <!-- Single-color symbolic drawing; background is transparent. Suitable for CSS/currentColor recoloring. -->
  <g fill="currentColor">
    <!-- The open shutter on the left -->
    <path d="M 3.5,1.5 H 8 L 4.7,14.5 H 3.5 A 2,2 0 0 1 1.5,12.5 V 3.5 A 2,2 0 0 1 3.5,1.5 Z"/>
    <!-- Upper and lower folds define the triangular opening -->
    <path d="M 9,1.5 H 12.5 A 2,2 0 0 1 14.5,3.5 V 6.7 L 8.2,4.4 Z"/>
    <path d="M 14.5,9.1 V 12.5 A 2,2 0 0 1 12.5,14.5 H 5.2 Z"/>
    <!-- Eye outline, intentionally drawn with no fine strokes -->
    <path fill-rule="evenodd" d="M 5.65,9.2 Q 8.8,4.6 13.5,8.25 Q 10.25,12.75 5.65,9.2 Z M 9.3,6.85 A 1.6,1.6 0 1 0 9.3,10.05 A 1.6,1.6 0 1 0 9.3,6.85 Z"/>
  </g>
</svg>
