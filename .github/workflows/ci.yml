name: Linux release packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  rpm:
    name: Fedora 44 RPM and tests (GCC)
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: >-
          dnf install -y git tar gzip gcc-c++ cmake cmake-rpm-macros make ninja-build
          rpm-build redhat-rpm-config pkgconf-pkg-config libzip-devel shadow-utils util-linux
          qt6-qtbase-devel qt6-qtpdf-devel qt6-qtmultimedia-devel kf6-kwindowsystem-devel kf6-syntax-highlighting-devel
          glib2-devel kf6-kio-devel kf6-kcoreaddons-devel qt6-qtwayland dbus-daemon python3 desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build binary and source RPMs; run CTest
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash packaging/fedora/build-rpm.sh
      - name: Upload RPMs and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora-44-x86_64
          path: build-rpm/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-test-logs
          path: build-rpm/BUILD/**/Testing/Temporary/*.log
          retention-days: 7

  install:
    name: Fedora 44 clean install and removal
    needs: rpm
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fedora-44-x86_64
          path: packages
      - name: Install and verify the package
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          sha256sum --check SHA256SUMS
          dnf install -y ./dzurkel-[0-9]*.x86_64.rpm dbus-daemon python3 git tar gzip shadow-utils util-linux
          rpm -V dzurkel
          dzurkel --version
          test -x /usr/bin/dzurkel
          # System service menus are trusted by location; RPM normalizes .desktop permissions.
          test -f /usr/share/kio/servicemenus/dzurkel.desktop
          test -f /usr/share/applications/dzurkel-settings.desktop
          for size in 16 22 24 32 48 64 128 256; do
            test -f "/usr/share/icons/hicolor/${size}x${size}/apps/dzurkel.png"
          done
          test -f /usr/share/icons/hicolor/scalable/apps/dzurkel.svg
          test -f /usr/share/icons/hicolor/scalable/apps/dzurkel-symbolic.svg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise installed preview on an isolated bus
        run: |
          useradd --create-home preview-user
          runuser -u preview-user -- dbus-run-session -- python3 tests/integration/InstallTest.py --smoke /usr/bin/dzurkel
      - name: Remove and verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          dnf remove -y dzurkel
          test ! -e /usr/bin/dzurkel
          test ! -e /usr/share/applications/dzurkel.desktop
          test ! -e /usr/share/applications/dzurkel-settings.desktop
          test ! -e /usr/share/kio/servicemenus/dzurkel.desktop
          test ! -e /usr/share/dzurkel/build-compatibility.json
          for size in 16 22 24 32 48 64 128 256; do
            test ! -e "/usr/share/icons/hicolor/${size}x${size}/apps/dzurkel.png"
          done
          test ! -e /usr/share/icons/hicolor/scalable/apps/dzurkel.svg
          test ! -e /usr/share/icons/hicolor/scalable/apps/dzurkel-symbolic.svg
          for adapter in audio highlighting desktop folder_size folder_size_gio; do
            test ! -e "/usr/lib64/dzurkel/plugins/libdzurkel_$adapter.so"
          done

  clang:
    name: Fedora 44 tests (Clang)
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: >-
          dnf install -y git tar gzip clang cmake make pkgconf-pkg-config
          libzip-devel qt6-qtbase-devel qt6-qtpdf-devel qt6-qtmultimedia-devel kf6-kwindowsystem-devel kf6-syntax-highlighting-devel
          glib2-devel kf6-kio-devel kf6-kcoreaddons-devel dbus-daemon python3 desktop-file-utils shadow-utils util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure and build
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_INSTALL_PREFIX=/usr
          runuser -u builder -- cmake --build build --parallel 2
      - name: Run tests
        run: runuser -u builder -- ctest --test-dir build --output-on-failure
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clang-test-logs
          path: build/Testing/Temporary/*.log
          retention-days: 7

  gnome:
    name: GNOME Wayland, focus and Nautilus Space
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and isolated desktop test dependencies
        run: >-
          dnf install -y git gcc-c++ cmake make pkgconf-pkg-config shadow-utils
          libzip-devel qt6-qtbase-devel qt6-qtpdf-devel qt6-qtmultimedia-devel kf6-kwindowsystem-devel kf6-syntax-highlighting-devel
          glib2-devel kf6-kio-devel kf6-kcoreaddons-devel qt6-qtwayland dbus-daemon python3 python3-gobject python3-pillow
          gnome-shell nautilus mesa-dri-drivers mesa-libEGL dejavu-sans-fonts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production app and native test observers
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- cmake -S . -B build-gnome -DCMAKE_BUILD_TYPE=Debug -DDZURKEL_BUILD_GNOME_TESTS=ON
          runuser -u builder -- cmake --build build-gnome --target dzurkel_gnome_probe --parallel 2
      - name: Require native GNOME presentation, real input and rendered placement
        run: runuser -u builder -- ctest --test-dir build-gnome -L gnome-native --output-on-failure --no-tests=error
      - name: Upload synthetic desktop report and captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnome-native-results
          path: build-gnome/gnome-native-artifacts/
          if-no-files-found: warn
          retention-days: 14

  deb:
    name: Debian 13 amd64 package and tests
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential debhelper cmake pkgconf qt6-base-dev qt6-pdf-dev qt6-multimedia-dev libkf6windowsystem-dev libkf6syntaxhighlighting-dev libglib2.0-dev libzip-dev dbus-daemon python3 desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build binary and source packages; run CTest
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env DEB_BUILD_OPTIONS=parallel=2 bash packaging/debian/build-deb.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-13-amd64
          path: build-deb/artifacts/*
          if-no-files-found: error
          retention-days: 14

  deb-install:
    name: Debian 13 clean install and removal
    needs: deb
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 15
    steps:
      - name: Install test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates dbus-daemon python3 desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debian-13-amd64
          path: packages
      - name: Verify contents, install, launch and remove
        shell: bash
        run: |
          set -euo pipefail
          (cd packages && sha256sum --check SHA256SUMS-debian-13-amd64)
          dpkg-deb --contents packages/dzurkel_*.deb
          apt-get install -y --no-install-recommends ./packages/dzurkel_*.deb
          test -z "$(dpkg --verify dzurkel)"
          useradd --create-home preview-user
          bash packaging/check-installed.sh installed
          apt-get purge -y dzurkel
          test "$(dpkg-query -W -f='${db:Status-Status}' dzurkel 2>/dev/null || true)" != installed
          bash packaging/check-installed.sh removed

  arch:
    name: Arch x86_64 package and tests
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git cmake pkgconf glib2 kio qt6-base qt6-webengine qt6-multimedia qt6-multimedia-ffmpeg qt6-wayland kwindowsystem syntax-highlighting libzip dbus python desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build package; run CTest
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash packaging/arch/build-arch.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-x86_64
          path: build-arch/artifacts/*
          if-no-files-found: error
          retention-days: 14

  arch-install:
    name: Arch clean install and removal
    needs: arch
    runs-on: ubuntu-24.04
    container: archlinux:base
    timeout-minutes: 15
    steps:
      - name: Install test tools
        run: |
          # The minimal image excludes docs; test the complete package payload.
          sed -i 's@usr/share/doc/\*@@' /etc/pacman.conf
          pacman -Syu --noconfirm --needed git dbus python desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-x86_64
          path: packages
      - name: Verify contents, install, launch and remove
        shell: bash
        run: |
          set -euo pipefail
          (cd packages && sha256sum --check SHA256SUMS-arch-x86_64)
          pacman -Qlp packages/dzurkel-[0-9]*.pkg.tar.zst
          pacman -U --noconfirm packages/dzurkel-[0-9]*.pkg.tar.zst
          pacman -Qkk dzurkel
          useradd --create-home preview-user
          bash packaging/check-installed.sh installed
          pacman -R --noconfirm dzurkel
          ! pacman -Q dzurkel
          bash packaging/check-installed.sh removed

  release:
    name: Attach verified release packages
    needs: [rpm, install, clang, gnome, deb-install, arch-install, baseline-debian12]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fedora-44-x86_64
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debian-13-amd64
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-x86_64
          path: packages
      - name: Attach packages to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          mkdir release-assets
          cp "packages/dzurkel-$version-1.fc44.x86_64.rpm" \
             "packages/dzurkel_$version-1_amd64.deb" \
             "packages/dzurkel-$version-1-x86_64.pkg.tar.zst" release-assets/
          (cd release-assets && sha256sum ./* > SHA256SUMS)
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

  baseline-debian12:
    name: Useful baseline on Debian 12 (Qt 6.4)
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Install baseline build and test tools
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          git ca-certificates build-essential cmake pkgconf libzip-dev
          qt6-base-dev qt6-pdf-dev dbus-daemon python3 desktop-file-utils
          util-linux passwd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build without optional adapters
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- cmake --preset baseline
          runuser -u builder -- cmake --build --preset baseline
      - name: Test the baseline and staged installation
        run: runuser -u builder -- ctest --preset baseline
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-12-baseline-evidence
          path: |
            build-baseline/build-compatibility.json
            build-baseline/Testing/Temporary/*.log
          retention-days: 14
